name: KeyLayoutManager
options:
  bundleIdPrefix: com.trulsaagedal
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.1"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  KeyLayoutManager:
    type: application
    platform: macOS
    sources:
      - path: KeyLayoutManager
        excludes:
          - "Resources/KeyLayoutManager.entitlements"
          - "Resources/Info.plist"
    resources:
      - path: KeyLayoutManager/Assets.xcassets
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trulsaagedal.KeyLayoutManager
        PRODUCT_NAME: KeyLayoutManager
        INFOPLIST_FILE: KeyLayoutManager/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: KeyLayoutManager/Resources/KeyLayoutManager.entitlements
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
    info:
      path: KeyLayoutManager/Resources/Info.plist
      properties:
        CFBundleName: KeyLayoutManager
        CFBundleDisplayName: Key Layout Manager
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundlePackageType: APPL
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "© 2026 Truls Aagedal"
        LSApplicationCategoryType: public.app-category.utilities
        NSDocumentsFolderUsageDescription: "Key Layout Manager needs access to your Documents folder to read and write Adobe Premiere Pro keyboard layout files."
        SUFeedURL: "https://raw.githubusercontent.com/aagedal/KeyLayoutManager/main/appcast.xml"
        SUPublicEDKey: "i3xudeqe+09I7n+FVFHmPxBa8cEWc3/ljLk3Y9bTEkY="
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true

  KeyLayoutManagerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - KeyLayoutManagerTests
    dependencies:
      - target: KeyLayoutManager
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trulsaagedal.KeyLayoutManagerTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  KeyLayoutManager:
    build:
      targets:
        KeyLayoutManager: all
        KeyLayoutManagerTests: [test]
    test:
      targets:
        - KeyLayoutManagerTests
    run:
      config: Debug
    archive:
      config: Release
